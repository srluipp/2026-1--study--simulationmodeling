title: "report"
output-dir: "_output"
standalone: true
self-contained: true

## Julia support
engine: julia
julia:
  exeflags: ["--project=../project"]

## Generic options
lang: ru-RU
number-sections: true
toc: true
toc-title: "Содержание"
toc-depth: 2

## Crossref customization
crossref:
  lof-title: "Список иллюстраций"
  lot-title: "Список таблиц"
  lol-title: "Листинги"

## Форматы
format:
  ## DOCX
  docx:
    toc: true
    number-sections: true
    toc-depth: 2
    bibliography: bib/cite.bib
    csl: _resources/csl/gost-r-7-0-5-2008-numeric.csl

  ## PDF
  pdf:
    documentclass: scrreprt
    papersize: a4
    fontsize: 12pt
    linestretch: 1.5
    colorlinks: false
    toc: true
    number-sections: true
    toc-depth: 2
    lof: true
    lot: true
    babel-lang: russian
    babel-otherlangs: english
    cite-method: biblatex
    biblio-style: gost-numeric
    biblatexoptions:
      - backend=biber
      - langhook=extras
      - autolang=other*
    csquotes: true
    bibliography: bib/cite.bib
    csl: _resources/csl/gost-r-7-0-5-2008-numeric.csl

include-in-header:
  - file: _resources/tex/preamble.tex

indent: true

